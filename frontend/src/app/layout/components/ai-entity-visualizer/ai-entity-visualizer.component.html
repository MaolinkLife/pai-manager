<div class="entity-wrap" [class.speaking]="speaking()" [class.in-call]="callActive()" [style.--entity-color]="entityColor()">
    <div class="panel-title">{{ "entityVisualizer.title" | translate }}</div>
    <div class="ambient" [style.background]="entityGlow()"></div>

    <div class="ring ring-one"></div>
    <div class="ring ring-two"></div>

    <div class="entity-core">
        <svg viewBox="0 0 200 200" class="entity-svg">
            <circle
                cx="100"
                cy="100"
                [attr.r]="80 + breath() + (talk() * 4)"
                fill="none"
                [attr.stroke]="entityColor()"
                stroke-width="0.5"
                stroke-dasharray="10 5"
                class="outer-orb"
            ></circle>

            <circle
                cx="100"
                cy="100"
                [attr.r]="40 + (breath() * 2) + (talk() * 9)"
                [attr.fill]="entityColor()"
                class="center-orb"
            ></circle>

            <path [attr.d]="entityPath()" [attr.fill]="entityColor()" class="entity-shape"></path>

            <g class="entity-eyes">
                <circle [attr.cx]="90 + eyeOffset()" cy="90" r="3" fill="white"></circle>
                <circle [attr.cx]="110 + eyeOffset()" cy="90" r="3" fill="white"></circle>
            </g>
        </svg>

        <div class="particles-layer">
            <span
                *ngFor="let p of particles"
                class="particle"
                [style.background]="entityColor()"
                [style.left.%]="p.x"
                [style.top.%]="p.y"
                [style.animation-delay.s]="p.delay"
            ></span>
        </div>
    </div>

    <div class="hud-line">
        <div class="hud-item">
            <p class="hud-label">{{ "entityVisualizer.cognitiveState" | translate }}</p>
            <p class="hud-value">{{ moodLabel() }}</p>
        </div>
        <div class="hud-item align-right">
            <p class="hud-label">{{ "entityVisualizer.stability" | translate }}</p>
            <p class="hud-value stable">{{ stabilityPercent() }}%</p>
        </div>
    </div>

    <div class="call-controls">
        <ng-container *ngIf="!callActive(); else activeCall">
            <button
                type="button"
                class="call-btn call-btn--start"
                (click)="startCall()"
                [disabled]="callBusy()"
                [title]="t('entityVisualizer.callStart')"
            >
                <app-custom-svg name="microphone" [size]="18"></app-custom-svg>
                <span>{{ "entityVisualizer.callStart" | translate }}</span>
            </button>
        </ng-container>
        <ng-template #activeCall>
            <span class="call-stage" [attr.data-stage]="callStage()">
                <span class="call-stage__dot"></span>
                {{ callStageLabel() }}
            </span>
            <button
                type="button"
                class="call-btn call-btn--end"
                (click)="endCall()"
                [disabled]="callBusy()"
                [title]="t('entityVisualizer.callEnd')"
            >
                <app-custom-svg name="stop" [size]="16"></app-custom-svg>
                <span>{{ "entityVisualizer.callEnd" | translate }}</span>
            </button>
        </ng-template>
    </div>

    <div class="scan-line"></div>
</div>
