<div class="ui-range-wrap">
    <input
        #rangeInput
        class="ui-range"
        type="range"
        [attr.id]="id || null"
        [min]="min"
        [max]="max"
        [step]="step"
        [disabled]="disabled"
        [value]="displayValue"
        (input)="onInput($event)"
        (blur)="markTouched()"
    />

    @if (showEdgeLabels) {
        <div class="ui-range-labels">
            <span>{{ minLabel }}</span>
            <span>{{ maxLabel }}</span>
        </div>
    }
</div>
