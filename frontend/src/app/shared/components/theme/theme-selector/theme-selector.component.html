<div class="theme-selector">
    <label for="theme-select">🎨 Тема:</label>
    <select
        id="theme-select"
        [(ngModel)]="currentTheme"
        (change)="switchTheme(currentTheme)"
    >
        @for (theme of themes; track theme) {
            <option [value]="theme">
                {{ theme | titlecase }}
            </option>
        }
    </select>
</div>
