[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q
markers =
    regression: stable regression coverage for existing functionality
    contour: whole-turn smoke tests on isolated storage (run via tests/contour/run_contour.py)
    live: needs a running external service; skipped with the reason when the service is down
    live_ollama: needs a running Ollama
